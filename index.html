<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>手寫筆記</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="手寫筆記">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E7E5E0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131416" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: library (shelf of notebook covers) and editor (pill toolbar on top, pages scroll vertically on a desk). Notewise-like. */
:root{
  --desk:#E7E5E0; --bar:#F6F5F2; --bar2:#FFFFFF; --fg:#1E2023; --fg2:#6A6F77; --rule:#D9D6CF; --chip:#ECEAE5;
  --accent:#2E7CF6; --accent-fg:#FFFFFF; --accent-soft:rgba(46,124,246,.12); --danger:#CF3B2F;
  --shadow:0 10px 32px rgba(20,22,26,.18); --pshadow:rgba(20,22,26,.16);
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif; --mono:"DM Mono",ui-monospace,"SF Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#131416; --bar:#1D1F23; --bar2:#25282D; --fg:#E7E9EC; --fg2:#9AA0A9; --rule:#363A41; --chip:#2D3137;
  --accent:#6FA6FF; --accent-fg:#0C1526; --accent-soft:rgba(111,166,255,.16); --danger:#FF7B6F;
  --shadow:0 10px 32px rgba(0,0,0,.5); --pshadow:rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --desk:#131416; --bar:#1D1F23; --bar2:#25282D; --fg:#E7E9EC; --fg2:#9AA0A9; --rule:#363A41; --chip:#2D3137;
  --accent:#6FA6FF; --accent-fg:#0C1526; --accent-soft:rgba(111,166,255,.16); --danger:#FF7B6F;
  --shadow:0 10px 32px rgba(0,0,0,.5); --pshadow:rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--desk);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* library */
#library{overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(28px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.lib{max-width:1100px;width:100%;margin:0 auto}
.lib-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 22px}
.lib-head h1{margin:0;font-size:26px;font-weight:700;letter-spacing:.06em}
.btn{appearance:none;border:1px solid var(--rule);background:var(--bar2);font-size:15px;min-height:44px;padding:0 16px;border-radius:12px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;white-space:nowrap}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:500}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff}
.btn:focus-visible,.ib:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:26px 20px}
.card{position:relative;min-width:0}
.card .cover{appearance:none;display:block;width:100%;border:0;padding:0;background:transparent;cursor:pointer;border-radius:5px;overflow:hidden;
  aspect-ratio:1000/1414;box-shadow:0 1px 2px var(--pshadow),0 8px 22px var(--pshadow)}
.card canvas{display:block;width:100%;height:100%;object-fit:contain}
.lh-acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.opts .btn{justify-content:flex-start;white-space:normal;text-align:left;padding:10px 14px}
.prog{text-align:center}
.prog .pmsg{margin:4px 0 0;font-size:16px;font-variant-numeric:tabular-nums}
.pbar{height:6px;border-radius:3px;background:var(--chip);overflow:hidden;margin:14px 0 18px}
.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.card .nm{margin-top:10px;font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:34px}
.card .mt{font-size:12px;color:var(--fg2);font-family:var(--mono)}
.card .cm{position:absolute;right:-6px;bottom:2px}
.empty{text-align:center;padding:60px 0;color:var(--fg2)}
.warn{background:var(--accent-soft);border-radius:10px;padding:10px 14px;font-size:13.5px;margin:0 0 18px}
.lib-foot{margin:36px 0 0;font-size:12.5px;color:var(--fg2);max-width:62ch}

/* editor bar */
.bar{display:flex;align-items:center;gap:8px;flex:0 0 auto;overflow-x:auto;scrollbar-width:none;
  padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 8px max(10px,env(safe-area-inset-left))}
.bar::-webkit-scrollbar{display:none}
.pill{display:flex;align-items:center;gap:1px;background:var(--bar);border:1px solid var(--rule);border-radius:999px;padding:3px;flex:0 0 auto}
.ib{appearance:none;border:0;background:transparent;width:42px;height:42px;border-radius:999px;display:grid;place-items:center;cursor:pointer;position:relative;padding:0;flex:0 0 auto}
.ib[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.ib:disabled{opacity:.3;cursor:default}
.ib .cdot{position:absolute;bottom:3px;left:50%;width:7px;height:7px;margin-left:-3.5px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px var(--bar)}
.ib.sm{width:36px;height:36px}
.ib.sm svg{width:18px;height:18px}
.sep{width:1px;height:24px;background:var(--rule);margin:0 4px;flex:0 0 auto}
.ind{display:flex;flex-direction:column;line-height:1.15;padding:0 12px 0 4px;white-space:nowrap}
#pg-ind{font-family:var(--mono);font-size:13px}
#saved{font-size:10.5px;color:var(--fg2)}
.grow{flex:1 1 auto;min-width:4px}
#stage{position:relative;flex:1 1 auto;overflow:hidden;touch-action:none}
#stage canvas{position:absolute;inset:0;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#ta{position:absolute;z-index:12;border:0;outline:1.5px dashed var(--accent);outline-offset:3px;background:transparent;resize:none;overflow:hidden;
  padding:0;margin:0;font-family:var(--sans);line-height:1.4;word-break:break-all;white-space:pre-wrap;border-radius:0}
#selmenu{position:absolute;z-index:15;display:flex;gap:1px;background:var(--bar2);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:3px}
#selmenu button{appearance:none;border:0;background:transparent;font-size:14px;min-height:40px;padding:0 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
#selmenu button:active{background:var(--chip)}
#selmenu .del{color:var(--danger)}
#paste{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:14;box-shadow:var(--shadow)}
#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--desk);
  font-size:14px;padding:8px 16px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .18s}
#toast.on{opacity:1}

/* tool panel */
#panel{position:fixed;z-index:30;width:min(340px,calc(100vw - 20px));background:var(--bar2);border:1px solid var(--rule);border-radius:18px;
  box-shadow:var(--shadow);padding:12px 16px 16px;overflow-y:auto;overscroll-behavior:contain}
.ph{display:flex;align-items:center;justify-content:center;position:relative;font-weight:700;font-size:16px;min-height:36px;margin-bottom:6px}
.ph .ib{position:absolute;right:-8px;top:0}
.pv{display:block;width:100%;height:72px;border-radius:10px;border:1px solid var(--rule)}
.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 6px}
.types button,.seg button{appearance:none;border:1px solid var(--rule);background:transparent;border-radius:12px;min-height:58px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13.5px}
.types button[aria-pressed="true"],.seg button[aria-pressed="true"]{border:2px solid var(--accent);color:var(--accent);background:var(--accent-soft)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.seg button{min-height:44px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:46px}
.row .lbl{font-size:15px}
.hint{font-size:12px;color:var(--fg2);margin:-6px 0 4px;line-height:1.45}
.num{font-family:var(--mono);min-width:58px;height:34px;padding:0 10px;border-radius:10px;background:var(--chip);display:grid;place-items:center;font-size:14px}
.slide{display:flex;align-items:center;gap:4px}
.slide input{flex:1 1 auto;min-width:0;height:36px;margin:0;accent-color:var(--accent)}
.stepper{display:flex;align-items:center;gap:2px}
.stepper .num{min-width:44px}
.sw{appearance:none;border:0;width:52px;height:31px;border-radius:999px;background:var(--rule);position:relative;cursor:pointer;flex:0 0 auto;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(21px)}
.panel hr,#panel hr{border:0;border-top:1px solid var(--rule);margin:8px 0}
.colors{display:flex;flex-wrap:wrap;gap:10px;padding:4px 0 2px}
.colors button{appearance:none;width:32px;height:32px;border-radius:50%;border:0;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);cursor:pointer;padding:0}
.colors button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bar2),0 0 0 4px var(--accent)}

/* sheets */
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(10,12,15,.38);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bar2);width:min(560px,100%);max-height:88vh;overflow-y:auto;overscroll-behavior:contain;border-radius:20px 20px 0 0;
  padding:18px max(18px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
.sheet.wide{width:min(920px,100%)}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:20px}}
.sheet h2{margin:0 0 14px;font-size:18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.field{display:block;margin:0 0 16px}
.field>span{display:block;font-size:13px;color:var(--fg2);margin-bottom:6px}
.field input[type=text]{width:100%;font:inherit;font-size:16px;min-height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--rule);background:var(--desk);color:var(--fg)}
.papers{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.papers button{appearance:none;border:1px solid var(--rule);background:transparent;border-radius:12px;padding:8px 6px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px}
.papers button[aria-pressed="true"]{border:2px solid var(--accent);color:var(--accent)}
.papers canvas{width:54px;height:76px;border-radius:3px;box-shadow:0 0 0 1px var(--rule)}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:18px 14px}
.thumb{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.thumb .tp{appearance:none;border:0;padding:0;background:transparent;cursor:pointer;width:100%;aspect-ratio:1000/1414;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px var(--rule),0 4px 12px var(--pshadow)}
.thumb .tp.cur{box-shadow:0 0 0 3px var(--accent)}
.thumb canvas{display:block;width:100%;height:100%}
.thumb .tn{font-family:var(--mono);font-size:12px;color:var(--fg2)}
.thumb .ta{display:flex;gap:0}
.thumb .add{aspect-ratio:1000/1414;width:100%;border:1.5px dashed var(--rule);border-radius:6px;background:transparent;cursor:pointer;color:var(--fg2);display:grid;place-items:center}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
</style>
</head>
<body>
<section id="library" class="screen">
  <div class="lib">
    <header class="lib-head"><h1>筆記</h1><div class="lh-acts"><button class="btn" id="backup" type="button">備份／還原</button><button class="btn" id="imp-pdf" type="button">匯入 PDF</button><button class="btn primary" id="new-book" type="button"></button></div></header>
    <p class="warn" id="db-warn" hidden>這個瀏覽器不能存檔，關掉頁面筆記就會不見。</p>
    <div class="shelf" id="shelf"></div>
    <div class="empty" id="empty" hidden><p>還沒有筆記本</p><button class="btn primary" id="new-book2" type="button">建立第一本</button></div>
    <p class="lib-foot">筆記存在這台 iPad 的「手寫筆記」App 裡，不會上傳。建議每週按「備份／還原」存一份備份到「檔案」或 iCloud。兩指點一下＝復原，三指點一下＝重做。</p>
  </div>
</section>

<section id="editor" class="screen" hidden>
  <header class="bar" role="toolbar" aria-label="筆記工具">
    <div class="pill">
      <button class="ib" id="b-back" type="button" aria-label="回書架"></button>
      <button class="ib" id="b-pages" type="button" aria-label="頁面總覽"></button>
      <div class="ind"><span id="pg-ind">1 / 1</span><span id="saved">已存檔</span></div>
    </div>
    <div class="grow"></div>
    <div class="pill">
      <button class="ib" id="b-undo" type="button" aria-label="復原"></button>
      <button class="ib" id="b-redo" type="button" aria-label="重做"></button>
      <span class="sep"></span>
      <button class="ib" id="b-finger" type="button" aria-label="用手指寫" aria-pressed="false"></button>
      <span class="sep"></span>
      <button class="ib" data-tool="lasso" type="button" aria-label="套索"></button>
      <button class="ib" data-tool="pen" type="button" aria-label="筆"></button>
      <button class="ib" data-tool="hl" type="button" aria-label="螢光筆"></button>
      <button class="ib" data-tool="er" type="button" aria-label="橡皮擦"></button>
      <button class="ib" data-tool="text" type="button" aria-label="文字"></button>
      <button class="ib" id="b-img" type="button" aria-label="插入圖片"></button>
    </div>
    <div class="grow"></div>
    <div class="pill">
      <button class="ib" id="b-share" type="button" aria-label="匯入與輸出"></button>
      <button class="ib" id="b-view" type="button" aria-label="閱讀模式" aria-pressed="false"></button>
      <button class="ib" id="b-more" type="button" aria-label="筆記本設定"></button>
    </div>
  </header>
  <div id="stage">
    <canvas id="base" aria-label="筆記頁面"></canvas>
    <canvas id="live" aria-hidden="true"></canvas>
    <textarea id="ta" hidden aria-label="文字方塊"></textarea>
    <div id="selmenu" hidden>
      <button type="button" data-act="del" class="del">刪除</button>
      <button type="button" data-act="cut">剪下</button>
      <button type="button" data-act="copy">拷貝</button>
      <button type="button" data-act="dup">再製</button>
      <button type="button" data-act="color">換成筆的顏色</button>
    </div>
    <button class="btn" id="paste" type="button" hidden>貼上</button>
  </div>
</section>

<div id="panel" hidden></div>
<div id="toast" role="status"></div>
<input type="file" id="file" accept="image/*" class="vh" tabindex="-1">
<input type="color" id="colorIn" class="vh" tabindex="-1">
<input type="file" id="pdfIn" accept="application/pdf,.pdf" class="vh" tabindex="-1">
<input type="file" id="bkIn" accept="application/json,.json,text/plain" class="vh" tabindex="-1">

<script>
(() => {
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));

/* ---------- constants (page units: a page is 1000 wide) ---------- */
const PW = 1000, PH = 1414, GAP = 28, ADD_Y = 44, ADD_H = 86;

const HOLD_MS = 550, HL_ALPHA = 0.38;

  dark:  {bg: '#24262A', line: '#3C4047', name: '深色'}
};
const PEN_COLORS = ['#141414', '#D10102', '#FBC903', '#FA7E31', '#9703F8', '#0109D0', '#2E99FB'];

  undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',

  lasso: '<path d="M7.6 15.6C4.6 14.7 3 13 3 11c0-3.6 4-6.5 9-6.5s9 2.9 9 6.5-4 6.5-9 6.5c-.9 0-1.8-.1-2.6-.3" stroke-dasharray="2.6 2.4"/><path d="M8.6 14.6c-1.6 1.2-1.6 3.2 0 3.9 1.3.6 1.4 1.8.4 2.6"/>',
  pen: '<path d="M4 20l1.1-4.4L15.6 5.1a2 2 0 0 1 2.8 0l.5.5a2 2 0 0 1 0 2.8L8.4 18.9z"/><path d="M13.8 6.9l3.3 3.3"/>',
  hl: '<path d="M9.2 17.6l-2.8-2.8 9.4-9.4a2 2 0 0 1 2.8 0 2 2 0 0 1 0 2.8z"/><path d="M6.4 14.8L4 19.5h4.3l.9-1.9"/><path d="M12.8 8.4l2.8 2.8"/>',
  er: '<path d="M8.8 19.5l-4.9-4.9a1.8 1.8 0 0 1 0-2.6l8.3-8.3a1.8 1.8 0 0 1 2.6 0l5 5a1.8 1.8 0 0 1 0 2.6l-8.2 8.2z"/><path d="M8.2 9.8l6 6"/><path d="M12 19.5h8"/>',
  text: '<path d="M5 7V4.8h14V7"/><path d="M12 4.8v14.7"/><path d="M9.2 19.5h5.6"/>',
  img: '<rect x="3.5" y="5" width="17" height="14" rx="2.2"/><circle cx="9" cy="10" r="1.7"/><path d="M20.5 15.5l-4.6-4.6-8.9 8.1"/>',

}

/* ---------- scribble to erase ---------- */
function isScribble(P){

    else if (dir <= 0 && v > ref + ext * 0.25){ if (dir < 0) rev++; dir = 1; ref = v; }
    else if ((dir > 0 && v > ref) || (dir < 0 && v < ref)) ref = v;

}

/* ---------- eraser ---------- */

    for (let i = 0; i < n - 1; i++) if (segDist(q[0], q[1], p[2*i], p[2*i+1], p[2*i+2], p[2*i+3]) < rr) return true;
    if (it.closed && segDist(q[0], q[1], p[2*n-2], p[2*n-1], p[0], p[1]) < rr) return true;

function densify(it, step){
  const p = it.p, n = p.length >> 1, P = [], R = it.r ? [] : null;

    for (let k = 1; k < m; k++){ const t = k / m; P.push(px + (x - px) * t, py + (y - py) * t); if (R) R.push(it.r[i] + (it.r[j] - it.r[i]) * t); }

}

/* ---------- saving ---------- */
const dirtyPages = new Set(); let saveT = 0, metaDirty = false;

function bookMeta(){ return {id: book.id, title: book.title, paper: book.paper, color: book.color, pages: pages.map(p => p.id), created: book.created, updated: book.updated}; }
function flush(){
  clearTimeout(saveT); if (!book) return Promise.resolve();
  const jobs = [];
  dirtyPages.forEach(pg => { if (pages.includes(pg)) jobs.push(DB.put('pages', pageRec(pg))); });
  dirtyPages.clear();
  if (metaDirty){ jobs.push(DB.put('books', bookMeta())); metaDirty = false; }
  return Promise.all(jobs).then(() => setSaved(true)).catch(() => { setSaved(true); toast('存檔失敗，iPad 空間可能不夠'); });
}
function markMeta(){ metaDirty = true; book.updated = Date.now(); scheduleSave(); }

/* ---------- history ---------- */
function commit(ch){

  undoS.push(ch); if (undoS.length > 300) undoS.shift(); redoS = []; syncUndo();
}
function undo(fromGesture){

  clearSel(); ch.forEach(c => { c.pg.items = c.before; touch(c.pg); }); redoS.push(ch); syncUndo();

}

  clearSel(); ch.forEach(c => { c.pg.items = c.after; touch(c.pg); }); undoS.push(ch); syncUndo();

}

/* ---------- rendering ---------- */
let raf = 0, needBase = false, needLive = false, zooming = false, inertia = null;
const CACHE = new Map();

function requestLive(){ needLive = true; kick(); }

function getCache(pg){

  if (e && e.ver === pg.ver && (zooming || Math.abs(e.ts - ts) < 1e-3)){ CACHE.delete(pg.id); CACHE.set(pg.id, e); return e; }

  const ne = {cv, ver: pg.ver, ts}; CACHE.delete(pg.id); CACHE.set(pg.id, ne);
  while (CACHE.size > 4){ const k = CACHE.keys().next().value, old = CACHE.get(k); old.cv.width = old.cv.height = 0; CACHE.delete(k); }

function setPT(c, i){ c.setTransform(dpr * V.z, 0, 0, dpr * V.z, dpr * (-V.x * V.z), dpr * ((pageTop(i) - V.y) * V.z)); }

  for (let i = 0; i < pages.length; i++){
    const pg = pages[i], H = phOf(pg), top = pageTop(i);

    const sx = -V.x * z, sy = (top - V.y) * z;
    c.setTransform(dpr, 0, 0, dpr, 0, 0); c.fillStyle = theme.pshadow; c.fillRect(sx - 0.5, sy + 1, PW * z + 1, H * z + 1);

/* ---------- ink ---------- */
let pmin = 1, pmax = 0, pressureOK = false;
function startInk(e, pi, byPen){

}

function drawPreview(){
  const cv = panel.querySelector('.pv'); if (!cv) return;
  const w = cv.clientWidth, h = cv.clientHeight, dp = Math.min(window.devicePixelRatio || 1, 3);

}

}

/* ---------- PDF import / export ---------- */
const CDN = {
  pdf: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfw: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  jspdf: 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
  jszip: 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
  cmaps: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/',
  fonts: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/standard_fonts/'
};
const SCRIPTS = {};
function loadScript(src){
  return SCRIPTS[src] || (SCRIPTS[src] = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.async = true;
    s.onload = () => res();
    s.onerror = () => { delete SCRIPTS[src]; s.remove(); rej(new Error('程式庫載入失敗，請確認有連上網路')); };
    document.head.appendChild(s);
  }));
}
async function getPdfjs(){
  // the worker script is loaded onto the page itself, so pdf.js runs without a separate worker
  await loadScript(CDN.pdf); await loadScript(CDN.pdfw);
  const L = window.pdfjsLib; if (!L) throw new Error('PDF 程式庫沒有載入');
  L.GlobalWorkerOptions.workerSrc = CDN.pdfw; return L;
}
function progress(msg){
  const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.style.zIndex = 70;
  bg.innerHTML = '<div class="sheet prog" role="dialog" aria-modal="true"><p class="pmsg" aria-live="polite"></p><div class="pbar"><i></i></div><button type="button" class="btn">取消</button></div>';
  document.body.appendChild(bg);
  const st = {
    cancelled: false,
    set(m, f){ bg.querySelector('.pmsg').textContent = m; if (f !== undefined) bg.querySelector('.pbar i').style.width = Math.round(f * 100) + '%'; },
    close(){ bg.remove(); }
  };
  bg.querySelector('button').onclick = () => { st.cancelled = true; st.set('取消中…'); };
  st.set(msg, 0); return st;
}
async function pdfToPages(file){
  const pr = progress('讀取 PDF…'), out = [];
  try{
    const L = await getPdfjs();
    const doc = await L.getDocument({data: new Uint8Array(await file.arrayBuffer()), cMapUrl: CDN.cmaps, cMapPacked: true, standardFontDataUrl: CDN.fonts, isEvalSupported: false}).promise;
    const n = doc.numPages;
    for (let i = 1; i <= n && !pr.cancelled; i++){
      pr.set(`匯入第 ${i} / ${n} 頁`, (i - 1) / n);
      const page = await doc.getPage(i), vp1 = page.getViewport({scale: 1}), vp = page.getViewport({scale: Math.min(4, 1500 / vp1.width)});
      const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
      const cx = cv.getContext('2d'); cx.fillStyle = '#FFFFFF'; cx.fillRect(0, 0, cv.width, cv.height);
      await page.render({canvasContext: cx, viewport: vp}).promise;
      const src = cv.toDataURL('image/jpeg', 0.86); cv.width = cv.height = 0; page.cleanup();
      const bgId = uid(), pg = {id: uid(), items: [], ver: 0, h: r1(PW * vp1.height / vp1.width), bg: bgId};
      await DB.put('bgs', {id: bgId, src}); await DB.put('pages', pageRec(pg));
      out.push(pg);
    }
    doc.destroy();
    if (pr.cancelled && out.length) toast(`已匯入前 ${out.length} 頁`);
  } catch(e){ toast('匯入失敗：' + ((e && e.message) || e)); }
  finally { pr.close(); }
  return out;
}
let pdfMode = 'new';
function pickPdf(mode){ pdfMode = mode; $('#pdfIn').value = ''; $('#pdfIn').click(); }
$('#pdfIn').addEventListener('change', async () => {
  const f = $('#pdfIn').files && $('#pdfIn').files[0]; if (!f) return;
  const ps = await pdfToPages(f); if (!ps.length) return;
  if (pdfMode === 'insert' && book){
    const at = curPage() + 1; pages.splice(at, 0, ...ps); relayout(); markMeta(); clampView(); jumpTo(at); toast(`已插入 ${ps.length} 頁`);
  } else {
    const now = Date.now(), bk = {id: uid(), title: f.name.replace(/\.pdf$/i, '').trim() || 'PDF 筆記', paper: 'grid', color: 'cream', pages: ps.map(p => p.id), created: now, updated: now};
    try{ await DB.put('books', bk); } catch(e){ toast('建立失敗：' + ((e && e.message) || e)); return; }
    openBook(bk.id);
  }
});
async function renderPageCanvas(pg, widthPx){
  await whenReady(pg);
  const s = widthPx / PW, cv = document.createElement('canvas'); cv.width = Math.round(widthPx); cv.height = Math.round(phOf(pg) * s);
  const c = cv.getContext('2d'); c.setTransform(s, 0, 0, s, 0, 0); drawPage(c, pg, book, 1.25); return cv;
}
const safeName = s => (s || '筆記').replace(/[\\/:*?"<>|]+/g, ' ').trim().slice(0, 80) || '筆記';
const toBlob = (cv, type, q) => new Promise((res, rej) => cv.toBlob(b => b ? res(b) : rej(new Error('圖片產生失敗')), type, q));
async function exportPdf(list, name){
  const pr = progress('準備輸出 PDF…');
  try{
    await loadScript(CDN.jspdf);
    const J = window.jspdf && window.jspdf.jsPDF; if (!J) throw new Error('PDF 程式庫沒有載入');
    let doc = null;
    for (let i = 0; i < list.length; i++){
      if (pr.cancelled) return;
      pr.set(`輸出第 ${i + 1} / ${list.length} 頁`, i / list.length);
      const pg = list[i], cv = await renderPageCanvas(pg, 1800), w = 595.28, h = r2(w * phOf(pg) / PW), o = w > h ? 'l' : 'p';
      const data = cv.toDataURL('image/jpeg', 0.92); cv.width = cv.height = 0;
      if (!doc) doc = new J({unit: 'pt', format: [w, h], orientation: o, compress: true}); else doc.addPage([w, h], o);
      doc.addImage(data, 'JPEG', 0, 0, w, h, undefined, 'FAST');
    }
    pr.set('產生檔案…', 1);
    const blob = doc.output('blob'); pr.close(); await saveFile(name + '.pdf', blob);
  } catch(e){ toast('輸出失敗：' + ((e && e.message) || e)); }
  finally { pr.close(); }
}
async function exportPng(pg, name){
  const pr = progress('輸出圖片…');
  try{ const cv = await renderPageCanvas(pg, 2000), b = await toBlob(cv, 'image/png'); cv.width = cv.height = 0; pr.close(); await saveFile(name + '.png', b); }
  catch(e){ toast('輸出失敗：' + ((e && e.message) || e)); }
  finally { pr.close(); }
}
async function exportZip(list, name){
  const pr = progress('準備輸出圖片…');
  try{
    await loadScript(CDN.jszip);
    const zip = new window.JSZip(), pad = Math.max(2, String(list.length).length);
    for (let i = 0; i < list.length; i++){
      if (pr.cancelled) return;
      pr.set(`輸出第 ${i + 1} / ${list.length} 頁`, i / list.length);
      const cv = await renderPageCanvas(list[i], 2000), b = await toBlob(cv, 'image/png'); cv.width = cv.height = 0;
      zip.file(`${name}-${String(i + 1).padStart(pad, '0')}.png`, b);
    }
    pr.set('打包中…', 1);
    const blob = await zip.generateAsync({type: 'blob', compression: 'STORE'}); pr.close(); await saveFile(name + '.zip', blob);
  } catch(e){ toast('輸出失敗：' + ((e && e.message) || e)); }
  finally { pr.close(); }
}
let dlP = null;
function getDL(){
  if (!dlP && window.claude && typeof window.claude.use === 'function') dlP = Promise.resolve(window.claude.use('downloads')).catch(() => null);
  return dlP || Promise.resolve(null);
}
async function saveFile(name, blob){
  const dl = await Promise.race([getDL(), new Promise(r => setTimeout(() => r(null), 4000))]);
  if (dl){
    try{ await dl.save({filename: name, data: blob}); toast('已存好：' + name); return; }
    catch(e){
      const c = e && e.code;
      if (c === 'declined'){ toast('沒有存檔'); return; }
      if (c === 'rate_limited'){ toast('上一個存檔視窗還開著，等一下再試'); return; }
      if (c === 'too_large'){ toast('檔案太大，請一次輸出少一點頁'); return; }
    }
  }
  offerFile(name, blob);
}
/* Outside Claude: the file is ready, the viewer taps once more so iPad's share sheet is allowed to open */
function shareableFile(name, blob){
  if (!navigator.canShare) return null;
  for (const type of [blob.type || 'application/octet-stream', 'application/octet-stream', 'text/plain']){
    try{ const f = new File([blob], name, {type}); if (navigator.canShare({files: [f]})) return f; }catch(e){}
  }
  return null;
}
function offerFile(name, blob){
  const url = URL.createObjectURL(blob), file = shareableFile(name, blob);
  const kb = blob.size / 1024, size = kb > 1024 ? (kb / 1024).toFixed(1) + ' MB' : Math.max(1, Math.round(kb)) + ' KB';
  const sh = openSheet(`<h2>檔案準備好了<button type="button" class="ib sm" data-x aria-label="關閉">${svg('x')}</button></h2>
    <p class="hint" style="margin:0 0 14px"><span id="of-name"></span>（${size}）</p>
    <div class="acts">${file ? '<button type="button" class="btn primary" id="of-share">分享或存到「檔案」</button>' : ''}<a class="btn${file ? '' : ' primary'}" id="of-dl">直接下載</a></div>`);
  $('#of-name').textContent = name;
  const a = $('#of-dl'); a.href = url; a.download = name;
  const done = () => { closeSheet(); setTimeout(() => URL.revokeObjectURL(url), 60000); };
  sh.querySelector('[data-x]').onclick = done;
  a.addEventListener('click', () => setTimeout(done, 300));
  if (file) $('#of-share').onclick = async () => {
    try{ await navigator.share({files: [file], title: name}); done(); }
    catch(e){ if (!e || e.name !== 'AbortError') toast('分享失敗，請改按「直接下載」'); }
  };
}

/* ---------- backup / restore (every notebook, editable) ---------- */
const ymd = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
async function backupAll(){
  const pr = progress('準備備份…');
  try{
    const books = await DB.all('books'), parts = [], bgIds = new Set();
    if (!books.length){ toast('書架上還沒有筆記本'); return; }
    parts.push(`{"app":"inknote","v":1,"exported":${Date.now()},"books":[`);
    for (let b = 0; b < books.length; b++){
      if (pr.cancelled) return;
      const bk = books[b]; pr.set(`備份第 ${b + 1} / ${books.length} 本`, b / books.length);
      const pgs = [];
      for (const pid of bk.pages){ const p = await DB.get('pages', pid); pgs.push(p || {id: pid, items: []}); if (p && p.bg) bgIds.add(p.bg); }
      parts.push((b ? ',' : '') + JSON.stringify({book: bk, pages: pgs}));
    }
    parts.push('],"bgs":[');
    let first = true;
    for (const id of bgIds){ const r = await DB.get('bgs', id); if (r){ parts.push((first ? '' : ',') + JSON.stringify(r)); first = false; } }
    parts.push(']}');
    const blob = new Blob(parts, {type: 'application/json'});
    pr.close(); await saveFile(`手寫筆記備份-${ymd()}.json`, blob);
  } catch(e){ toast('備份失敗：' + ((e && e.message) || e)); }
  finally { pr.close(); }
}
async function restoreBackup(file){
  const pr = progress('讀取備份…'); let n = 0;
  try{
    const data = JSON.parse(await file.text());
    if (!data || data.app !== 'inknote' || !Array.isArray(data.books)) throw new Error('這不是手寫筆記的備份檔');
    const bgs = Array.isArray(data.bgs) ? data.bgs : [];
    for (let i = 0; i < bgs.length && !pr.cancelled; i++){
      pr.set(`還原 PDF 頁面 ${i + 1} / ${bgs.length}`, i / Math.max(1, bgs.length) * 0.5);
      const r = bgs[i]; if (r && typeof r.id === 'string' && typeof r.src === 'string') await DB.put('bgs', {id: r.id, src: r.src});
    }
    for (let i = 0; i < data.books.length && !pr.cancelled; i++){
      const e = data.books[i], bk = e && e.book, pgs = e && Array.isArray(e.pages) ? e.pages : null;
      if (!bk || typeof bk.id !== 'string' || !Array.isArray(bk.pages) || !pgs) continue;
      pr.set(`還原第 ${i + 1} / ${data.books.length} 本`, 0.5 + i / data.books.length * 0.5);
      for (const p of pgs) if (p && typeof p.id === 'string') await DB.put('pages', {id: p.id, items: Array.isArray(p.items) ? p.items : [], ...(p.h ? {h: p.h} : {}), ...(p.bg ? {bg: p.bg} : {})});
      await DB.put('books', {id: bk.id, title: String(bk.title || '筆記本'), paper: bk.paper || 'grid', color: bk.color || 'cream', pages: bk.pages, created: bk.created || Date.now(), updated: bk.updated || Date.now()});
      n++;
    }
    toast(`已還原 ${n} 本筆記`);
  } catch(e){ toast('還原失敗：' + ((e && e.message) || e)); }
  finally { pr.close(); renderLibrary(); }
}
function openBackupSheet(){
  const sh = openSheet(`<h2>備份與還原<button type="button" class="ib sm" data-x aria-label="關閉">${svg('x')}</button></h2>
    <div class="opts"><button type="button" class="btn primary" id="bk-save">備份整個書架（.json）</button><button type="button" class="btn" id="bk-load">從備份檔還原</button></div>
    <p class="hint" style="margin:12px 0 0">備份檔留著所有筆跡，還原後還能繼續改，跟 PDF 不一樣。換到新的 App 或新 iPad 時，用這個把筆記搬過去。還原時，同一本筆記會換成備份裡的版本。</p>`);
  sh.querySelector('[data-x]').onclick = closeSheet;

}
$('#bkIn').addEventListener('change', () => { const f = $('#bkIn').files && $('#bkIn').files[0]; if (f) restoreBackup(f); });
$('#backup').addEventListener('click', openBackupSheet);
function openShareSheet(){

  const sh = openSheet(`<h2>匯入與輸出<button type="button" class="ib sm" data-x aria-label="關閉">${svg('x')}</button></h2>
    <div class="field"><span>輸出</span><div class="opts">
